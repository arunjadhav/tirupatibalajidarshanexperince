<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Divine Journey: Chennai, Tirupati & Beyond</title>
    <!-- Google Fonts for Handwriting in English & Devanagari (Kalam) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Indie+Flower&family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --pad-bg: #fcf8ec;
            --line-color: #d1d8e0;
            --margin-line: #ffb8b8;
            --text-color: #2b2b2b;
            --accent-color: #8b4513;
            --tip-bg: #fff3cd;
        }

        body {
            background-color: #e4dccc;
            color: var(--text-color);
            line-height: 1.9;
            margin: 0;
            padding: 20px;
            font-size: 1.25rem;
        }

        /* Default English Font (Handwriting) */
        #content-en {
            font-family: 'Indie Flower', cursive;
        }

        /* Marathi Font - Kalam (Handwritten Devanagari Calligraphy) */
        #content-mr {
            font-family: 'Kalam', cursive;
            font-size: 1.2rem; /* Adjusted slightly for comfortable reading in Kalam */
            line-height: 2.1;
        }

        /* Notepad Sheet Container */
        .notepad {
            max-width: 850px;
            margin: 30px auto;
            background-color: var(--pad-bg);
            padding: 60px 60px 80px 90px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
            border-radius: 4px;
            position: relative;
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 40px;
        }

        /* Red Margin Line on the Left */
        .notepad::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 65px;
            width: 2px;
            background-color: var(--margin-line);
        }

        /* Spiral Binding Simulation at the Top */
        .spiral-binding {
            display: flex;
            justify-content: space-around;
            position: absolute;
            top: -15px;
            left: 50px;
            right: 50px;
        }

        .spiral-ring {
            width: 25px;
            height: 25px;
            background: linear-gradient(135deg, #bbb, #555);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Language Switcher */
        .lang-switcher {
            position: absolute;
            top: 25px;
            right: 40px;
            z-index: 10;
        }

        .lang-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 16px;
            font-family: 'Caveat', cursive;
            font-size: 1.3rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        /* Typography & Headers */
        h1, h2 {
            font-family: 'Caveat', cursive;
            color: var(--accent-color);
        }

        /* Override headers for Marathi to use Kalam smoothly */
        #content-mr h1, #content-mr h2 {
            font-family: 'Kalam', cursive;
            font-weight: 700;
        }

        h1 {
            font-size: 3.2rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.05);
        }

        .subtitle {
            text-align: center;
            font-style: italic;
            color: #555;
            margin-bottom: 45px;
            font-size: 1.3rem;
        }

        h2 {
            font-size: 2.3rem;
            margin-top: 50px;
            margin-bottom: 15px;
            border-bottom: 2px dashed #b0a892;
            padding-bottom: 5px;
        }

        p {
            margin-bottom: 22px;
            text-align: justify;
        }

        strong {
            font-weight: bold;
            color: #1a1a1a;
        }

        /* Traveler's Tip Box */
        .tip-box {
            background: var(--tip-bg);
            border: 1px solid #e0cf9b;
            padding: 15px 20px;
            margin: 25px 0;
            border-radius: 4px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.05);
            font-size: 1.2rem;
            position: relative;
        }

        .tip-box::before {
            content: "📌 Traveler's Note:";
            display: block;
            font-weight: bold;
            color: #856404;
            margin-bottom: 5px;
        }

        #content-mr .tip-box::before {
            content: "📌 प्रवाशांसाठी टीप:";
        }

        /* Language Toggle Classes */
        .lang-mr {
            display: none;
        }

        /* Footer */
        .notepad-footer {
            text-align: center;
            margin-top: 70px;
            font-family: 'Caveat', cursive;
            font-size: 1.7rem;
            color: var(--accent-color);
        }

        #content-mr ~ .notepad-footer {
            font-family: 'Kalam', cursive;
        }

        @media (max-width: 768px) {
            .notepad {
                padding: 40px 20px 40px 35px;
                margin: 10px;
            }
            .notepad::before {
                left: 25px;
            }
            .lang-switcher {
                top: 15px;
                right: 15px;
            }
            h1 {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="notepad">
        <!-- Spiral Binding Visual Elements -->
        <div class="spiral-binding">
            <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
        </div>

        <!-- Language Toggle Button -->
        <div class="lang-switcher">
            <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">मराठी मध्ये वाचा</button>
        </div>

        <!-- ================= ENGLISH CONTENT ================= -->
        <div id="content-en">
            <h1>Our Divine Journey</h1>
            <div class="subtitle">From Pune Airport to Chennai Waves & The Sacred Hills of Tirupati</div>

            <h2>Chapter 1: The Grand Takeoff & The Missing Document Drama</h2>
